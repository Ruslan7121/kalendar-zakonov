# П8 (12.11.2026): ежедневный прогон конвейера по расписанию — будни в 21:17 по Москве (после пленарных заседаний).
# Шаги: pipeline/run_daily.sh за сегодняшний день (голосования, календарь, законопроекты, органы, путь закона, аудит)
# → проверка схемы данных (validate_data.mjs) → тесты → pipeline/commit.sh (коммит и push в main)
# → pipeline/publish.sh (сайт в gh-pages). Тексты «Суть» / «Кого коснётся» по-прежнему пишет бот отдельным шагом
# (BOT_PROMPT.md): после автоматического прогона новые голосования видны на сайте сразу, тексты — после бота.
# Вручную: Actions → daily → Run workflow (можно указать день ДД.ММ.ГГГГ).
# Доступ к сайтам с ограничением по региону — через pipeline/fetch.sh (списки RU-прокси обновляются сами);
# кэш sozd и списки прокси переносятся между запусками через actions/cache. Если источник недоступен,
# run_daily.sh пишет об этом в логи и не трогает данные — коммит и публикация тогда просто не нужны.
name: daily
on:
  schedule:
    - cron: '17 18 * * 1-5'   # 18:17 UTC = 21:17 МСК, пн–пт
    # Н2 (13.11.2026): повторы, если основной прогон упал или источник не ответил (22:47 и 23:47 МСК); после успешного — пропускаются
    - cron: '47 19 * * 1-5'
    - cron: '47 20 * * 1-5'
  workflow_dispatch:
    inputs:
      day:
        description: 'День ДД.ММ.ГГГГ (пусто — сегодня по Москве)'
        required: false
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: daily-run
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GO=1
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 18 * * 1-5" ]; then
            N="$(gh run list -R "${{ github.repository }}" --workflow daily.yml --status success --created ">=$(date -u +%Y-%m-%dT18:00:00Z)" --json databaseId -q length || echo 0)"
            [ "${N:-0}" -gt 0 ] && GO=0
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"; echo "повтор нужен: $GO"
  run:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Moscow
      GD_DUMA: ${{ github.workspace }}/../duma
      GD_REQUIRE_BROWSER: '1'
      # путь закона (и инициатор/комитет с sozd): только свежие и «в пути», законопроекты без инициатора — первыми; не дольше 60 минут
      TRACK_DAYS: '14'
      TRACK_BUDGET_SEC: '3600'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Зависимости (pdftotext для пояснительных записок, npm)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          npm install --no-audit --no-fund
          mkdir -p "$GD_DUMA/lists" "$GD_DUMA/bills" "$GD_DUMA/days"
      - name: Кэш конвейера (страницы sozd, списки прокси, days/)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/../duma
          key: duma-${{ github.run_id }}
          restore-keys: duma-
      - name: Автор коммитов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Прогон (pipeline/run_daily.sh)
        id: run
        run: |
          DAY="${{ github.event.inputs.day }}"
          # 14.11.2026: GitHub запускает расписание с опозданием (13.11 — на 5 часов, уже после полуночи по Москве).
          # Плановый прогон до 12:00 МСК относится к вчерашнему дню, иначе вчерашний день пропускается.
          if [ -z "$DAY" ]; then if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%H)" -lt 12 ]; then DAY="$(date -d yesterday +%d.%m.%Y)"; else DAY="$(date +%d.%m.%Y)"; fi; fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          bash pipeline/run_daily.sh "$DAY" 2>&1 | tee daily.log
          # Н2: источник не ответил — остальное всё равно собираем и публикуем, но прогон в конце помечается неуспешным (сработает повтор)
          if grep -q "список голосований за .* не загружен" daily.log; then echo "src_fail=1" >> "$GITHUB_OUTPUT"; fi
      - name: Проверка схемы данных
        run: node pipeline/validate_data.mjs
      - name: Проверка типов и тесты
        run: |
          npm run typecheck
          bash tests/run_all.sh
      - name: Коммит в main (pipeline/commit.sh)
        run: bash pipeline/commit.sh "Ежедневный прогон ${{ steps.run.outputs.day }} (автоматически)"
      - name: Публикация (pipeline/publish.sh)
        run: bash pipeline/publish.sh "Ежедневный прогон ${{ steps.run.outputs.day }}"
      - name: Источник голосований не ответил
        if: steps.run.outputs.src_fail == '1'
        run: |
          echo "vote.duma.gov.ru не отдал список голосований — прогон повторится по расписанию (22:47 и 23:47 МСК)"; exit 1
      # Н1 (13.11.2026): о сбое прогона владелец узнаёт из обращения (issue) — GitHub присылает его на почту
      - name: Сообщить о сбое
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          { echo "Ежедневный прогон за ${{ steps.run.outputs.day }} завершился с ошибкой: $URL"; echo; echo '```'; tail -n 40 daily.log 2>/dev/null || true; echo '```'; } > issue.md
          N="$(gh issue list -R "${{ github.repository }}" --state open --search 'Сбой ежедневного прогона in:title' --json number -q '.[0].number' || true)"
          if [ -n "$N" ]; then gh issue comment "$N" -R "${{ github.repository }}" --body-file issue.md
          else gh issue create -R "${{ github.repository }}" --title "Сбой ежедневного прогона" --body-file issue.md; fi
      - name: Сводка
        if: always()
        run: |
          { echo "### Прогон ${{ steps.run.outputs.day }}"; echo '```'; tail -n 60 daily.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
