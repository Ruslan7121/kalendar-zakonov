# 17.11.2026: разовая и по требованию догрузка пояснительных записок к старым законопроектам (extracts/bills/*.json).
# Выжимки записок хранятся в git только с 15.11.2026; по ним пишутся «Суть», «Кого коснётся», метки и пары «Что сейчас / Что предлагалось изменить».
# Запуск: Actions → notes → Run workflow; поле «from» — с какого дня брать голосования (ДД.ММ.ГГГГ, по умолчанию 01.10.2026).
# Берёт из canvas все дни с голосованиями по законопроектам начиная с этого дня и запускает pipeline/bills.py (sozd через RU-прокси,
# уже полученные записки не перезапрашиваются). Данные сайта не меняет: коммит только extracts/bills/, сайт не пересобирается.
name: notes
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'С какого дня (ДД.ММ.ГГГГ)'
        required: false
        default: '01.10.2026'
permissions:
  contents: write
concurrency:
  group: daily-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Europe/Moscow
      GD_DUMA: ${{ github.workspace }}/../duma
      GD_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Зависимости (pdftotext для записок)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p "$GD_DUMA/lists" "$GD_DUMA/bills" "$GD_DUMA/days"
      - name: Кэш конвейера (страницы sozd, списки прокси)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/../duma
          key: duma-${{ github.run_id }}
          restore-keys: duma-
      - name: Автор коммитов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Записки (pipeline/bills.py по дням с голосованиями)
        env:
          IN_FROM: ${{ github.event.inputs.from }}
        run: |
          FROM="01.10.2026"; [[ "$IN_FROM" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]] && FROM="$IN_FROM"
          cd pipeline
          DAYS="$(python3 - "$FROM" <<'PY'
          import sys, re, datetime as dt, common as C
          p = lambda s: dt.datetime.strptime(s, '%d.%m.%Y')
          f = p(sys.argv[1]); out = []
          for d, v, n, q, r in C.votes(C.read_canvas()):
              if re.fullmatch(r'\d+-\d+', n) and p(d) >= f and d not in out: out.append(d)
          print(' '.join(out))
          PY
          )"
          echo "дней: $(echo $DAYS | wc -w)"; echo "$DAYS"
          python3 bills.py $DAYS 2>&1 | tee ../notes.log
      - name: Коммит записок (extracts/bills) в main
        run: |
          git add extracts/bills/*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "новых записок нет"; exit 0; fi
          git commit -m "Пояснительные записки к законопроектам с ${{ github.event.inputs.from }} (автоматически)"
          for try in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break || sleep 5; done
      - name: Сводка
        if: always()
        run: |
          { echo '### Пояснительные записки'; echo '```'; tail -n 40 notes.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
