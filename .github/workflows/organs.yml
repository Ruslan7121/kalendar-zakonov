# 14.11.2026: сбор только органов — документы и новости Совета Федерации, Банка России, Минфина, Минтруда, Минюста
# (pipeline/organs.py за последние 7 дней, --embed) → проверка данных и тесты → коммит в main → публикация сайта.
# Голосования Госдумы, календарь и законопроекты не собирает. По расписанию 4 раза днем (10:13–19:13 МСК) и вручную: Actions → organs → Run workflow.
# 16.11.2026: + указы и распоряжения Президента, постановления и распоряжения Правительства (API publication.pravo.gov.ru).
name: organs
on:
  # 16.11.2026: и днем по расписанию — заседания, приказы, указы и постановления появляются в календаре без ожидания вечернего daily
  schedule:
    - cron: '13 */3 * * *'   # UTC 0,3,…,21 → МСК 1:13, 4:13, 7:13, 10:13, 13:13, 16:13, 19:13, 22:13 (каждые 3 часа)
  workflow_dispatch:
    inputs:
      from:
        description: 'Длинный сбор: с какой даты (ДД.ММ.ГГГГ). Пусто — обычные 7 дней'
        required: false
        default: ''
      only:
        description: 'Только указанное, через запятую: pres (указы Президента) или gov (акты Правительства). Пусто — всё'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: daily-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Moscow
      GD_DUMA: ${{ github.workspace }}/../duma
      GD_REQUIRE_BROWSER: '1'
      ORGANS_PROXY: '1'   # 18.11.2026: закрытые для GitHub сайты министерств (Минфин, Минтруд, Минюст) — через RU-прокси конвейера
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Зависимости
        run: |
          npm install --no-audit --no-fund
          # 19.11.2026: тексты новых документов органов (сканы PDF publication.pravo.gov.ru) — pdftotext и tesseract rus
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus >/dev/null || echo 'tesseract не установлен — тексты сканов будут отмечены fail'
          mkdir -p "$GD_DUMA/lists" "$GD_DUMA/bills" "$GD_DUMA/days"
      - name: Кэш конвейера (списки RU-прокси)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/../duma
          key: duma-organs-${{ github.run_id }}
          restore-keys: duma-
      - name: Автор коммитов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Сбор органов (pipeline/organs.py)
        id: collect
        env:
          IN_FROM: ${{ github.event.inputs.from }}
          IN_ONLY: ${{ github.event.inputs.only }}
        run: |
          FROM="$(date -d '7 days ago' +%d.%m.%Y)"; TO="$(date +%d.%m.%Y)"; XARGS=()
          # 17.11.2026: длинный сбор вручную (например, указы Президента с 1 октября): даты и «только» — из полей запуска, в команду как аргументы
          [[ "$IN_FROM" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]] && { FROM="$IN_FROM"; XARGS+=(--pages 60); }
          [[ "$IN_ONLY" =~ ^(pres|gov)(,(pres|gov))?$ ]] && XARGS+=(--only "$IN_ONLY")
          cd pipeline && python3 organs.py --from "$FROM" --to "$TO" "${XARGS[@]}" --embed 2>&1 | tee ../organs.log
          # 19.11.2026: официальные тексты новых документов → extracts/organs/ (по ним ИИ пишет «Суть»; без текста — пометка в out/TODO.md)
          timeout 12m python3 organ_texts.py --from "$FROM" 2>&1 | tail -n 30 | tee -a ../organs.log || echo 'organ_texts: не завершен, продолжим в следующий запуск'
          cd .. && python3 pipeline/strip_code_only.py && node pipeline/split_data.mjs
      - name: Проверка схемы данных
        run: node pipeline/validate_data.mjs
      - name: Проверка типов и тесты
        id: tests
        # 19.11.2026: проверка готовности текстов (test_texts_org — «Суть»/«Кого коснётся») коммит и публикацию не блокирует:
        # новые документы органов с ORG_HIDE_FROM (19.11.2026) без текстов и так скрыты на сайте. Любой другой упавший тест — блокирует.
        run: |
          set +e
          npm run typecheck; tc=$?
          bash tests/run_all.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"; rc=${PIPESTATUS[0]}
          hard=$(grep '^FAIL: ' "$RUNNER_TEMP/tests.log" | grep -v -E '^FAIL: python3 tests/test_texts_org\.py$')
          if [ $tc = 0 ] && [ $rc = 0 ]; then echo 'ok=1' >> "$GITHUB_OUTPUT"
          elif [ $tc = 0 ] && [ -z "$hard" ]; then echo 'ok=1' >> "$GITHUB_OUTPUT"; echo '::warning::Тексты органов не готовы (test_texts_org) — данные коммитятся, документы без «Сути» скрыты'
          else echo 'ok=0' >> "$GITHUB_OUTPUT"; echo "::error::Тесты не прошли: ${hard:-typecheck}"; fi
          exit 0
      - name: Коммит в main (pipeline/commit.sh)
        if: steps.tests.outputs.ok == '1'
        run: bash pipeline/commit.sh "Документы и новости органов (автоматически)"
      - name: Публикация (pipeline/publish.sh)
        if: steps.tests.outputs.ok == '1'
        run: bash pipeline/publish.sh "Документы и новости органов"
      # 19.11.2026: если тесты или проверка схемы упали, собранное не теряется: в main уходят только сырые данные сбора
      # (out/organs/events.json, status.json, тексты extracts/organs) — без canvas и data/, сайт не публикуется, прогон помечается ошибкой.
      # Следующий прогон (organs.py --embed) или агент встраивает их в canvas.
      - name: Коммит собранных данных без публикации (тесты не прошли)
        if: always() && steps.collect.outcome == 'success' && steps.tests.outputs.ok != '1'
        run: |
          git reset -q
          git add out/organs/events.json out/organs/status.json 2>/dev/null || true
          git add extracts/organs/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Органы: собранные документы и тексты без публикации (тесты не прошли)"
            git stash -q --include-untracked || true
            for try in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
          fi
          echo 'Тесты не прошли: данные органов закоммичены, сайт не опубликован'; exit 1
      - name: Сводка
        if: always()
        run: |
          { echo '### Органы'; echo '```'; cat organs.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
