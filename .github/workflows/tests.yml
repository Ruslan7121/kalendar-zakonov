# Тесты «Календаря законов» (12.11.2026, пункт 8): Python-тесты конвейера, инварианты сайта в Node
# (каждый законопроект из DATA виден в календаре, формат ссылки «Поделиться») и правило 11 в headless Chrome.
# Только проверка: CI ничего не публикует, не пушит в gh-pages и не запускает pipeline/publish/publish.sh или commit.sh.
name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Moscow
      GD_REQUIRE_BROWSER: '1'
      GD_REQUIRE_WEBKIT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: npm install (react, esbuild — версии закреплены в package.json)
        run: npm install --no-audit --no-fund
      # 22.11.2026: проверка стиля — ESLint (скрипты .mjs), Prettier (код сайта и скрипты), ruff (Python); версии закреплены
      - name: Установка ruff
        run: pip install -q -r requirements-dev.txt
      - name: Проверка стиля (ESLint, Prettier, ruff)
        run: npm run check:style
      - name: Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" && "$CHROME" --version
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      # 22.11.2026: WebKit (движок Safari/Telegram на iPhone) для tests/js/test_webkit.browser.mjs; версия Playwright закреплена
      - name: WebKit (Playwright)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps webkit
      # 19.11.2026: pipeline/check/ci_tests.sh — проверка типов и тесты; код 3 («тексты не готовы»: SHORT, «Суть», метки) — предупреждение, не ошибка
      - name: Проверка типов и тесты (pipeline/check/ci_tests.sh)
        run: bash pipeline/check/ci_tests.sh; rc=$?; [ $rc = 0 ] || [ $rc = 3 ]
